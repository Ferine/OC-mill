<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OC-Mill</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>OC-Mill</h1>
      <div class="actions">
        <button id="btn-new">+ New run</button>
        <button id="btn-refresh">↻</button>
      </div>
    </header>
    <main>
      <aside id="sidebar">
        <h2>Runs</h2>
        <ul id="run-list"></ul>
      </aside>
      <section id="detail">
        <p class="muted">Select a run from the sidebar, or start a new one.</p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
